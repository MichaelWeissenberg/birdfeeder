services:
  birdfeeder:
    build:
      context: .
      dockerfile: Dockerfile

    image: birdfeeder-atlas:local
    container_name: birdfeeder

    network_mode: host

    env_file:
      - .env

    volumes:
      - /srv/birdfeeder:/data

    restart: "unless-stopped"

    environment:
      RUN_ONCE: "false"
      INTERVAL_SECONDS: "5"

      WEB_ENABLED: "true"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"

      FULL_FRAME_FALLBACK: "true"
      FALLBACK_CLASSIFICATION_THRESHOLD: "0.40"
      FALLBACK_CLASSIFICATION_MARGIN: "0.20"

  birdfeeder-web:
    image: birdfeeder-atlas:local
    container_name: birdfeeder-web

    command:
      - python
      - /app/web.py

    volumes:
      - /srv/birdfeeder:/data:ro

    ports:
      - "8080:8080"

    restart: "unless-stopped"
