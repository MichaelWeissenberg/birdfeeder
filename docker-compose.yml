services:
  birdfeeder:
    build:
      context: .
      dockerfile: Dockerfile

    image: birdfeeder:local
    container_name: birdfeeder

    network_mode: host

    env_file:
      - .env

    volumes:
      - /srv/birdfeeder:/data

    restart: unless-stopped

  birdfeeder-web:
    image: birdfeeder:local
    container_name: birdfeeder-web

    command:
      - python
      - /app/web.py

    env_file:
      - .env

    volumes:
      - /srv/birdfeeder:/data

    ports:
      - "8080:8080"

    restart: unless-stopped

  birdfeeder-retention:
    image: birdfeeder:local
    container_name: birdfeeder-retention

    command:
      - python
      - /app/retention.py
      - --delete
      - --loop

    env_file:
      - .env

    volumes:
      - /srv/birdfeeder:/data

    restart: unless-stopped
